name: build

on: [push, pull_request]

jobs:
  python:
    name: "Python Tests"

    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: pre-commit checks - setup cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

    - name: pre-commit checks - run checks
      uses: pre-commit/action@v3.0.1

  C:
    name: "C Builds"

    strategy:
      matrix:
        arch: [x86, riscv]
        compiler: [llvm-12, llvm-13, llvm-14, gcc-12, clang-12, clang-13, clang-14]

        include:
          - arch: x86
            compiler: gcc-9
          - arch: x86
            compiler: gcc-10
          - arch: x86
            compiler: gcc-11

          # Cross toolchain prefix, for every riscv job
          - arch: riscv
            cross: riscv64-linux-gnu-

    runs-on: ubuntu-22.04

    env:
      ARCH: ${{matrix.arch}}
      CROSS_COMPILE: ${{matrix.cross}}

    steps:
    - name: Install
      run: |
        c=${{matrix.compiler}}
        v=${c##llvm-}
        case $c in
            # Need all {llvm,clang,lld}-$v packages
            llvm-*)  EXTRA="clang-${v} lld-${v}" ;;
            # Cross gcc-N is packaged as gcc-N-<triple>
            gcc-*)   c=$c${CROSS_COMPILE:+-${CROSS_COMPILE%-}} ;;
            # Clang cross-compiles natively, but links with GNU binutils
            clang-*) EXTRA=${CROSS_COMPILE:+binutils-${CROSS_COMPILE%-}} ;;
        esac

        sudo apt-get update -q
        sudo apt-get install -y build-essential python3 $c ${EXTRA}

    - uses: actions/checkout@v4

    - name: Build
      run: |
        c=${{matrix.compiler}}

        # Select appropriate LLVM= or CC=
        case $c in
            llvm-*)  COMP="LLVM=${c#llvm}" ;;
            clang-*) COMP="CC=$c${CROSS_COMPILE:+ --target=${CROSS_COMPILE%-}}" ;;
            *)       COMP="CC=${CROSS_COMPILE}$c" ;;
        esac

        make -j`nproc` "$COMP"
